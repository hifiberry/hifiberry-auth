# Included at server level by the web UI's nginx block. Present only when
# hifiberry-auth is installed, so without this package nginx does no gating.
location = /_auth/verify {
    internal;
    proxy_pass http://127.0.0.1:1089/_auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URI $request_uri;
}
# Inherited by every /api/<service>/ location; exempt locations set `auth_request off`.
auth_request /_auth/verify;
auth_request_set $hifiberry_auth_hint $upstream_http_www_authenticate_hint;
error_page 401 = @hifiberry_auth_401;
location @hifiberry_auth_401 {
    internal;
    add_header WWW-Authenticate-Hint $hifiberry_auth_hint always;
    return 401;
}
